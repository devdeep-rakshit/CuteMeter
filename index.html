<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CuteMeter 🎀</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>CuteMeter 🎀</h1>
            <p class="tagline">A tiny test of your legendary cuteness.</p>
        </header>
        
        <main id="main-content">
            <div class="camera-wrapper">
                <video id="camera-feed" autoplay playsinline></video>
                <div id="countdown-overlay" class="hidden">
                    <svg class="progress-ring" width="120" height="120">
                        <circle class="progress-ring__circle" stroke="white" stroke-width="8" fill="transparent" r="52" cx="60" cy="60"/>
                    </svg>
                    <span id="countdown-text">10</span>
                </div>
                <div id="result-overlay" class="hidden">
                    <div class="score-card">
                        <h2 id="cuteness-score">Score: 98/100 💗</h2>
                        <p id="compliment-text">You are too cute!</p>
                        <button id="retry-btn">Measure Again 💖</button>
                    </div>
                </div>
            </div>
            
            <div id="instructions" class="instructions">
                <p>Loading camera... ✨</p>
            </div>
        </main>
        
        <footer>
            <p class="privacy-note">Privacy Note: The camera feed is processed entirely on your device. No photos are saved, uploaded, or transmitted.</p>
        </footer>
    </div>
    <script src="js/compliments.js"></script>
    <script src="js/score-generator.js"></script>
    <script src="js/countdown.js"></script>
    <script src="js/camera.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
